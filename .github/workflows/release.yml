name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/litenode-linux-$arch" ./cmd/litenode
          done
          cd dist
          sha256sum litenode-linux-amd64 litenode-linux-arm64 > sha256sums.txt
          cat sha256sums.txt

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from the annotated tag message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if [ ! -s notes.md ]; then echo "LiteNode $TAG" > notes.md; fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
