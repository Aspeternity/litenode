name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/litenode-linux-$arch" ./cmd/litenode
          done
          cd dist
          sha256sum litenode-linux-amd64 litenode-linux-arm64 > sha256sums.txt
          cat sha256sums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Run each released binary on its own architecture before publishing
  # (D-048).
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify checksum and run version
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          grep " litenode-linux-$ARCH\$" sha256sums.txt | sha256sum -c -
          chmod +x "litenode-linux-$ARCH"
          out=$("./litenode-linux-$ARCH" version)
          echo "$out"
          case "$out" in
            "LiteNode $TAG (linux/$ARCH)") ;;
            *) echo "unexpected version output"; exit 1 ;;
          esac

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from the annotated tag message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if [ ! -s notes.md ]; then echo "LiteNode $TAG" > notes.md; fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
